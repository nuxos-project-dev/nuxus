name: Nightly Build and Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang and build-essential
        run: |
          sudo apt update
          sudo apt install -y clang build-essential

      - name: Build
        run: |
          make

      - name: Archive build directory
        run: |
          tar -czf nuxus-nightly.tar.gz build/

      - name: Remove old Nightly Tag & Release
        run: |
          gh release delete nightly --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Nightly build (${{ github.run_number }})"
          body: |
            Nightly build
          files:
            nuxus-nightly.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
